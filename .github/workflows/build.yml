name: Build and check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Release builds are cut and signed locally (see dist/ and .keys/ in the carlinkit
      # workspace); CI only proves that the tree compiles, lints and tests cleanly.
      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlexLauncher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
